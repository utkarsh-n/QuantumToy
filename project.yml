name: QuantumToy
options:
  bundleIdPrefix: com.utkarsh
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  QuantumCore:
    type: framework
    platform: iOS
    sources: [Sources/QuantumCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.quantumtoy.core
  QuantumToy:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: QuantumCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Quantum Toy
        CFBundleName: Quantum Toy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.quantumtoy
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QuantumToyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: QuantumToy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.quantumtoy.uitests
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  QuantumToy:
    build:
      targets:
        QuantumToy: all
    test:
      targets:
        - QuantumToyUITests
